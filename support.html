<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kriko Support</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<style>
  :root {
    --accent: #E0293D;
    --accent-soft: #FCE6E8;
    --ink: #1A1A1E;
    --ink-secondary: #5B5B63;
    --ink-tertiary: #9A9AA2;
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --border: #E7E7EA;
    --success: #1E8E5A;
    --success-soft: #E3F5EC;
    --error: #C81E3A;
    --error-soft: #FCE6E8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #FF5A6E;
      --accent-soft: #3A1418;
      --ink: #F2F2F4;
      --ink-secondary: #B8B8C0;
      --ink-tertiary: #7A7A82;
      --bg: #141416;
      --surface: #1C1C1F;
      --border: #2C2C30;
      --success: #4ADE94;
      --success-soft: #103322;
      --error: #FF6B7F;
      --error-soft: #3A1418;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    line-height: 1.6;
    padding: 0 20px 64px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 28px 0 8px; }
  .brand .mark { width: 30px; height: 30px; border-radius: 8px; flex: none; display: block; }
  .brand .name { font-weight: 700; font-size: 15px; color: var(--ink-secondary); letter-spacing: 0.02em; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; margin: 18px 0 4px; text-wrap: balance; }
  p.meta { color: var(--ink-tertiary); font-size: 15px; margin: 0 0 32px; }
  label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-secondary); margin: 20px 0 6px; }
  input, textarea {
    width: 100%; font: inherit; font-size: 15px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 120px; }
  button {
    margin-top: 24px; width: 100%; font: inherit; font-size: 16px; font-weight: 700;
    color: #fff; background: var(--accent); border: none; border-radius: 12px;
    padding: 14px; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .status { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; display: none; }
  .status.success { display: block; color: var(--success); background: var(--success-soft); }
  .status.error { display: block; color: var(--error); background: var(--error-soft); }
  .lang-switch { display: flex; gap: 6px; padding: 4px 0 8px; flex-wrap: wrap; }
  .lang-switch a {
    font-size: 12px; font-weight: 600; color: var(--ink-secondary); text-decoration: none;
    padding: 5px 10px; border-radius: 100px; border: 1px solid var(--border); cursor: pointer;
  }
  .lang-switch a.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img class="mark" src="apple-touch-icon.png" alt="" />
      <div class="name">KRIKO</div>
    </div>
    <div class="lang-switch" id="langSwitch"></div>
    <h1 id="title">Contact Support</h1>
    <p class="meta" id="subtitle">Questions, bug reports or feedback about Kriko — send us a message and we'll get back to you by email.</p>

    <form id="form">
      <label id="labelName" for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" />

      <label id="labelEmail" for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />

      <label id="labelMessage" for="message">Message</label>
      <textarea id="message" name="message" required></textarea>

      <button id="submitBtn" type="submit">Send</button>
      <div class="status" id="status"></div>
    </form>

    <p class="meta" style="margin-top:40px;"><a href="index.html" style="color:var(--ink-secondary);">Privacy Policy &amp; Terms of Service</a></p>
  </div>

<script>
(function () {
  var SUPABASE_URL = "https://crcjyqvybnlaguuhlzdb.supabase.co";
  var SUPABASE_KEY = "sb_publishable_hivDp5byU0wp9jtqyk2LZQ_pMkVbm4C";
  var SUPPORTED_LOCALES = ["en", "tr", "de", "fr"];

  var STRINGS = {
    en: {
      title: "Contact Support",
      subtitle: "Questions, bug reports or feedback about Kriko — send us a message and we'll get back to you by email.",
      name: "Name", email: "Email", message: "Message", send: "Send", sending: "Sending…",
      success: "Thanks — your message was sent. We'll reply by email.",
      error: "Something went wrong. Please try again in a moment."
    },
    tr: {
      title: "Destek ile İletişime Geçin",
      subtitle: "Kriko hakkında sorular, hata bildirimleri veya geri bildirimler için bize mesaj gönderin, e-posta ile size dönüş yapalım.",
      name: "Ad", email: "E-posta", message: "Mesaj", send: "Gönder", sending: "Gönderiliyor…",
      success: "Teşekkürler — mesajınız gönderildi. E-posta ile size dönüş yapacağız.",
      error: "Bir şeyler ters gitti. Lütfen biraz sonra tekrar deneyin."
    },
    de: {
      title: "Support kontaktieren",
      subtitle: "Fragen, Fehlerberichte oder Feedback zu Kriko — schick uns eine Nachricht, wir antworten per E-Mail.",
      name: "Name", email: "E-Mail", message: "Nachricht", send: "Senden", sending: "Wird gesendet…",
      success: "Danke — deine Nachricht wurde gesendet. Wir antworten per E-Mail.",
      error: "Etwas ist schiefgelaufen. Bitte versuche es gleich noch einmal."
    },
    fr: {
      title: "Contacter le support",
      subtitle: "Questions, bugs ou retours sur Kriko — envoyez-nous un message, nous répondrons par e-mail.",
      name: "Nom", email: "E-mail", message: "Message", send: "Envoyer", sending: "Envoi…",
      success: "Merci — votre message a été envoyé. Nous répondrons par e-mail.",
      error: "Une erreur est survenue. Veuillez réessayer dans un instant."
    }
  };

  function currentLocale() {
    var p = new URLSearchParams(window.location.search);
    var loc = p.get("locale");
    return SUPPORTED_LOCALES.indexOf(loc) === -1 ? "en" : loc;
  }

  function renderLangSwitch(locale) {
    var el = document.getElementById("langSwitch");
    el.innerHTML = "";
    var labels = { en: "English", tr: "Türkçe", de: "Deutsch", fr: "Français" };
    SUPPORTED_LOCALES.forEach(function (loc) {
      var a = document.createElement("a");
      a.textContent = labels[loc];
      var p = new URLSearchParams(window.location.search);
      p.set("locale", loc);
      a.href = "?" + p.toString();
      if (loc === locale) a.className = "active";
      el.appendChild(a);
    });
  }

  function applyStrings(locale) {
    var s = STRINGS[locale];
    document.title = "Kriko — " + s.title;
    document.getElementById("title").textContent = s.title;
    document.getElementById("subtitle").textContent = s.subtitle;
    document.getElementById("labelName").textContent = s.name;
    document.getElementById("labelEmail").textContent = s.email;
    document.getElementById("labelMessage").textContent = s.message;
    document.getElementById("submitBtn").textContent = s.send;
    return s;
  }

  var locale = currentLocale();
  renderLangSwitch(locale);
  var s = applyStrings(locale);

  var form = document.getElementById("form");
  var btn = document.getElementById("submitBtn");
  var status = document.getElementById("status");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    status.className = "status";
    btn.disabled = true;
    btn.textContent = s.sending;

    var payload = {
      name: document.getElementById("name").value || null,
      email: document.getElementById("email").value,
      message: document.getElementById("message").value
    };

    fetch(SUPABASE_URL + "/rest/v1/support_messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (!res.ok) throw new Error("request failed");
      status.textContent = s.success;
      status.className = "status success";
      form.reset();
      btn.textContent = s.send;
      btn.disabled = false;
    }).catch(function () {
      status.textContent = s.error;
      status.className = "status error";
      btn.textContent = s.send;
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
